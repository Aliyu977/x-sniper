name: X-Sniper Runner
on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 mins
  workflow_dispatch: # Allows manual trigger from iPhone

jobs:
  build:
    runs-on: ubuntu-latest
    # --- ADD THIS SECTION BELOW ---
    permissions:
      contents: write
    # ------------------------------
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with: {python-version: '3.10'}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
      - name: Run Sniper
        env:
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py
      - name: Save Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database.db state.json || echo "Files not found"
          git commit -m "Update state and database" || echo "No changes to commit"
          git push
